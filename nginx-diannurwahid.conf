server {
    listen 80;
    server_name diannurwahid.com www.diannurwahid.com;
    root /var/www/dian-portofolio;
    index index.html;

    location / {
        try_files $uri $uri/ /server.js;
    }

    location /api {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}